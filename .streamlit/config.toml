# Streamlit app config ??? controls both local streamlit run and the
# Streamlit Community Cloud deployment. Lives here (committed) so the
# deployed app picks up identical behavior to local dev, without
# toggling flags in the SCC UI every redeploy.

[server]
# Headless: required on Streamlit Community Cloud (no browser auto-open).
headless = true
# Run on the standard port. SCC ignores this and routes via its proxy, but
# matching the default avoids confusion when debugging locally.
port = 8501

[browser]
# Don't phone home for usage stats on the deployed instance ??? the demo
# is public-facing and there's no need to leak visitor IPs to Streamlit's
# telemetry just for a portfolio link.
gatherUsageStats = false

[theme]
# Match the README's UI screenshot / dark-clinical aesthetic.
base = "light"
primaryColor = "#E11D48"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[client]
# Show error tracebacks in the deployed UI when something breaks ??? the
# app's whole point is being inspectable, so the deploy should be too.
showErrorDetails = true
toolbarMode = "minimal"