# Resize control: square crop of the shorter side (no stretching, no aspect-ratio band; the sides are cropped).
# Same split and hyperparameters as vision_patient_disjoint_dedup_rho_v1_0.yaml; only data.resize_mode differs.
checkpoint:
  dir: checkpoints/vision_resize_center_crop
  monitor_metric: val_macro_auroc
  save_best_only: true
data:
  image_dir: data/raw/images
  image_size: 224
  resize_mode: center_crop
  train_csv: data/processed_patient_disjoint_dedup_rho_v1_0/train.csv
  val_csv: data/processed_patient_disjoint_dedup_rho_v1_0/val.csv
  test_csv: data/processed_patient_disjoint_dedup_rho_v1_0/test.csv
logging:
  log_dir: logs/vision_resize_center_crop
  log_every_n_steps: 50
model:
  dropout: 0.2
  name: densenet121
  pretrained: true
  use_cbam: true
train:
  batch_size: 32
  early_stopping_patience: 4
  epochs: 15
  lr: 0.0001
  lr_scheduler: cosine
  num_workers: 4
  optimizer: adamw
  pin_memory: false
  seed: 42
  weight_decay: 1.0e-05
