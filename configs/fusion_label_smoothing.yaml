# Fusion model with label smoothing, testing whether the calibration fix
# that worked for vision (see configs/vision_label_smoothing.yaml) also
# helps here. Identical to fusion.yaml except for label_smoothing and
# separate checkpoint/log dirs.

data:
  train_csv: "data/processed/train.csv"
  val_csv: "data/processed/val.csv"
  test_csv: "data/processed/test.csv"
  image_dir: "data/raw/images"
  image_size: 224

model:
  name: "densenet121_fusion"
  pretrained: true
  tabular_embedding_dim: 64
  dropout: 0.2
  use_cbam: true

train:
  epochs: 15
  batch_size: 32
  num_workers: 4
  pin_memory: false
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  lr_scheduler: "cosine"
  early_stopping_patience: 4
  seed: 42
  label_smoothing: 0.1

checkpoint:
  dir: "checkpoints/fusion_label_smoothing"
  save_best_only: true
  monitor_metric: "val_macro_auroc"

logging:
  log_dir: "logs/fusion_label_smoothing"
  log_every_n_steps: 50