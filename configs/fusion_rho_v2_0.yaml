# Corrected synthetic-signal experiment, rho=0
checkpoint:
  dir: checkpoints/fusion_rho_v2_0
  monitor_metric: val_macro_auroc
  save_best_only: true
data:
  image_dir: data/raw/images
  image_size: 224
  test_csv: data/processed_rho_v2_0/test.csv
  train_csv: data/processed_rho_v2_0/train.csv
  val_csv: data/processed_rho_v2_0/val.csv
logging:
  log_dir: logs/fusion_rho_v2_0
  log_every_n_steps: 50
model:
  dropout: 0.2
  name: densenet121_fusion
  pretrained: true
  tabular_embedding_dim: 64
  use_cbam: true
train:
  batch_size: 32
  early_stopping_patience: 4
  epochs: 15
  lr: 0.0001
  lr_scheduler: cosine
  num_workers: 4
  optimizer: adamw
  pin_memory: false
  seed: 42
  weight_decay: 1.0e-05
