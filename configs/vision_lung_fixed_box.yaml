# Outline control: every image shows only the same centred box (72% of the side, area 0.52, matching the mean thorax mask); the rest is gray (train and validation).
# Same split and hyperparameters as vision_patient_disjoint_dedup_rho_v1_0.yaml.
checkpoint:
  dir: checkpoints/vision_lung_fixed_box
  monitor_metric: val_macro_auroc
  save_best_only: true
data:
  image_dir: data/raw/images
  image_size: 224
  train_csv: data/processed_patient_disjoint_dedup_rho_v1_0/train.csv
  val_csv: data/processed_patient_disjoint_dedup_rho_v1_0/val.csv
  test_csv: data/processed_patient_disjoint_dedup_rho_v1_0/test.csv
  lung_masking:
    mode: fixed_box
    box_fraction: 0.72
logging:
  log_dir: logs/vision_lung_fixed_box
  log_every_n_steps: 50
model:
  dropout: 0.2
  name: densenet121
  pretrained: true
  use_cbam: true
train:
  batch_size: 32
  early_stopping_patience: 4
  epochs: 15
  lr: 0.0001
  lr_scheduler: cosine
  num_workers: 4
  optimizer: adamw
  pin_memory: false
  seed: 42
  weight_decay: 1.0e-05
