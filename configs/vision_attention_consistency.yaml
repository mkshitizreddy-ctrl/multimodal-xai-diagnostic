# Config for the attention-consistency training experiment — same
# DenseNet-121 + CBAM architecture as vision_baseline.yaml, but trained
# with an extra loss term (src/models/attention_consistency_loss.py)
# penalizing CBAM's own spatial attention for falling outside the
# segmented lung field, instead of only measuring this after training the
# way measure_lung_localization.py does.
#
# Requires precomputed lung masks first:
#   python data/scripts/precompute_lung_masks.py --train-config configs/vision_attention_consistency.yaml
# Then:
#   python src/train_attention_consistency.py --train-config configs/vision_attention_consistency.yaml
#
# use_cbam must stay true here — src/train_attention_consistency.py
# refuses to run otherwise (see its use_cbam check in main()).

data:
  train_csv: "data/processed/train.csv"
  val_csv: "data/processed/val.csv"
  image_dir: "data/raw/images"
  image_size: 224

model:
  name: "densenet121"
  pretrained: true
  dropout: 0.2
  use_cbam: true

train:
  epochs: 15
  batch_size: 32
  num_workers: 4
  pin_memory: false
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  lr_scheduler: "cosine"
  early_stopping_patience: 4
  seed: 42
  # Weight on the attention-consistency loss term (added to BCE). 0.1 is a
  # starting point, not a tuned value — this is a first pass at the idea,
  # not a result of hyperparameter search. Worth trying a couple of other
  # values (e.g. 0.05, 0.3) and comparing if there's time, same way the
  # CBAM comparison itself used multiple seeds rather than trusting one run.
  attention_consistency_weight: 0.1

checkpoint:
  dir: "checkpoints/vision_attention_consistency"
  save_best_only: true
  monitor_metric: "val_macro_auroc"

logging:
  log_dir: "logs/vision_attention_consistency"
  log_every_n_steps: 50
