# Config for the vision-only DenseNet-121 baseline (Phase 2 of the roadmap)

data:
  train_csv: "data/processed/train.csv"
  val_csv: "data/processed/val.csv"
  image_dir: "data/raw/images"
  image_size: 224

model:
  name: "densenet121"
  pretrained: true
  dropout: 0.2
  # CBAM attention (Woo et al. ECCV 2018) inserted after the backbone,
  # before pooling. Added after reading the pneumonia-CXR literature —
  # see docs/architecture.md#attention-module for the papers and why.
  # Set false to reproduce the original no-CBAM baseline numbers in the README.
  use_cbam: true

train:
  epochs: 15
  batch_size: 32
  num_workers: 4
  pin_memory: false   # avoids a known Windows+CUDA access-violation crash; set true if your setup handles it
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  lr_scheduler: "cosine"
  early_stopping_patience: 4
  seed: 42

checkpoint:
  dir: "checkpoints/vision_baseline"
  save_best_only: true
  monitor_metric: "val_macro_auroc"

logging:
  log_dir: "logs/vision_baseline"
  log_every_n_steps: 50
