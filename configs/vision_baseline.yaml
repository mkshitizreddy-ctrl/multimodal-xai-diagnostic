# Config for the vision-only DenseNet-121 baseline (Phase 2 of the roadmap)

data:
  train_csv: "data/processed/train.csv"
  val_csv: "data/processed/val.csv"
  image_dir: "data/raw/images"
  image_size: 224

model:
  name: "densenet121"
  pretrained: true
  dropout: 0.2

train:
  epochs: 15
  batch_size: 32
  num_workers: 4
  lr: 1e-4
  weight_decay: 1e-5
  optimizer: "adamw"
  lr_scheduler: "cosine"
  early_stopping_patience: 4
  seed: 42

checkpoint:
  dir: "checkpoints/vision_baseline"
  save_best_only: true
  monitor_metric: "val_macro_auroc"

logging:
  log_dir: "logs/vision_baseline"
  log_every_n_steps: 50
