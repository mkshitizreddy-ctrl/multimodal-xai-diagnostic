# Data configuration for the Chest X-ray Pneumonia dataset (current pipeline).
#
# Switched from the full NIH Chest X-ray14 dataset (see configs/data_nih_legacy.yaml)
# to keep disk/compute requirements manageable for local training (~2GB vs
# ~45GB). Prepared by data/scripts/prepare_pneumonia_dataset.py, which
# downloads the images AND generates the tabular features below directly —
# there is no separate preprocess.py step for this dataset (unlike NIH).
#
# IMPORTANT: Patient Age, Patient Gender, Temperature, and SpO2 are
# SYNTHETIC — the source dataset ships images only, no EHR data. See
# docs/ethics_statement.md before presenting any results from this pipeline.

dataset:
  name: "chest-xray-pneumonia"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_dir: "data/raw/images"

image:
  size: 224            # DenseNet-121 expects 224x224
  channels: 1           # chest X-rays are grayscale; replicated to 3ch in model input
  normalize_mean: 0.5
  normalize_std: 0.25

labels:
  # Binary classification: is Pneumonia present in this X-ray?
  classes:
    - "Pneumonia"

tabular_features:
  # SYNTHETIC — see module docstring above and docs/ethics_statement.md
  - "Patient Age"
  - "Patient Gender"
  - "Temperature"
  - "SpO2"

split:
  # Train/test is preserved exactly as the original dataset curators split
  # it (already patient-disjoint). Validation is carved out of the train
  # split only, patient-grouped — see prepare_pneumonia_dataset.py.
  val_frac_of_train: 0.15
  random_seed: 42
