<svg width="100%" viewBox="0 0 680 402" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Multimodal fusion architecture</title>
<desc>Chest X-ray image and patient metadata are encoded separately by a vision encoder and a tabular encoder, fused together, and used to predict pneumonia probability. An explanation module produces Grad-CAM and counterfactual visualizations from the prediction.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.label { font-size: 14px; fill: #2c2c2a; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; }
.arr { stroke: #5f5e5a; stroke-width: 1; fill: none; }
</style>

<text class="label" x="190" y="40" text-anchor="middle">X-ray image</text>
<line x1="190" y1="48" x2="190" y2="62" class="arr" marker-end="url(#arrow)"/>

<text class="label" x="490" y="40" text-anchor="middle">Patient metadata*</text>
<line x1="490" y1="48" x2="490" y2="62" class="arr" marker-end="url(#arrow)"/>

<rect x="80" y="64" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="title" x="190" y="86" text-anchor="middle" fill="#0C447C">Vision encoder</text>
<text class="sub" x="190" y="104" text-anchor="middle" fill="#185FA5">DenseNet-121</text>

<rect x="380" y="64" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="title" x="490" y="86" text-anchor="middle" fill="#085041">Tabular encoder</text>
<text class="sub" x="490" y="104" text-anchor="middle" fill="#0F6E56">MLP</text>

<line x1="190" y1="120" x2="300" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="120" x2="380" y2="170" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="170" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="title" x="340" y="192" text-anchor="middle" fill="#3C3489">Fusion layer</text>
<text class="sub" x="340" y="210" text-anchor="middle" fill="#534AB7">Concatenate + MLP head</text>

<line x1="340" y1="226" x2="340" y2="244" class="arr" marker-end="url(#arrow)"/>

<rect x="230" y="244" width="220" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="title" x="340" y="271" text-anchor="middle" fill="#712B13">Pneumonia probability</text>

<line x1="340" y1="288" x2="340" y2="306" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="306" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="title" x="340" y="328" text-anchor="middle" fill="#633806">Grad-CAM + counterfactual</text>
<text class="sub" x="340" y="346" text-anchor="middle" fill="#854F0B">explanation module</text>

</svg>
